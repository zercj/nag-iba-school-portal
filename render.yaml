services:
  - type: web
    name: nag-iba-school-portal
    runtime: node
    region: ohio
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nag-iba-school-portal-db
          property: connectionString
      - key: BOOTSTRAP_DEVELOPERS
        sync: false

databases:
  - name: nag-iba-school-portal-db
    databaseName: nag_iba_school_portal
    user: nag_iba_portal
    region: ohio
    plan: basic-256mb
