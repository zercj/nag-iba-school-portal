services:
  - type: web
    name: nag-iba-school-portal
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_DEVELOPERS
        sync: false
